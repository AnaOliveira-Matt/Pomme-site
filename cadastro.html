    <section class="formularioCadastro">
        <p>Cadastro</p>
        <form id="formCadastro" onsubmit="enviarJSONCliente(event)">
            <div>
                <label for="nome">Nome</label>
                <input type="text" placeholder="Nome" id="nome" required>
            </div>
            <div>
                <label for="email">E-mail</label>
                <!-- Importante pro C# -->
                <input type="email" placeholder="Email" id="email" required>
            </div>
            <div>
                <label for="endereco">Endereço</label>
                <input type="text" placeholder="Rua, bairro - Estado" id="endereco">
            </div>
            <div>
                <label for="telefone">Telefone</label>
                <input type="tel" placeholder="(31)9xxxx-xxxx" id="telefone" oninput="mascara_telefone()" maxlength="14">
            </div>
            <div>
                <label for="senha">Senha</label>
                <input type="password" placeholder="Senha" id="senha" required>
            </div>
            <p id="login">Já tem uma conta? Faça <a href="login.html">login</a></p>
            <button type="submit">Enviar</button>
        </form>
    </section>
